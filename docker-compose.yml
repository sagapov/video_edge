version: '3.8'

services:
  video-edge:
    build: .
    ports:
      - "1935:1935"  # RTMP
      - "3000:3000"  # API
      - "8000:8000"  # HTTP
    environment:
      - RTMP_PORT=1935
      - API_PORT=3000
      - HTTP_PORT=8000
      - DEFAULT_PROVIDERS=${DEFAULT_PROVIDERS:-}
    restart: unless-stopped
    container_name: video-edge-service
